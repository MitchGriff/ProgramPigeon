version: "3.9"

services:

  # --- PostgreSQL database ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: programpigeon
      POSTGRES_PASSWORD: programpigeon
      POSTGRES_DB: programpigeon
    volumes:
      - pgdata:/var/lib/postgresql/data  # Named volume for data persistence
    ports:
      - "5432:5432"  # Expose locally so you can connect with a DB client
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U programpigeon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI backend ---
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy  # Wait for Postgres to be ready before starting
    volumes:
      - ./backend:/app  # Bind mount for hot reload in development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- React frontend (Vite dev server for local development) ---
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent host node_modules from overwriting
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  pgdata:
